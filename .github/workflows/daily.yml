name: Weekday BLS pipeline

on:
  schedule:
    # 14:30 UTC, Monday through Friday. That is after the usual 12:30 UTC
    # employment-situation release, in both daylight and standard time.
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

# Read the repo and publish artifacts. Do not grant permission to push.
# Spreadsheet credentials and the alert webhook are left unset.
permissions:
  contents: read

jobs:
  unemployment-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        working-directory: gov-api-pipeline
        run: python -m pip install -r requirements.txt

      - name: Run pipeline
        working-directory: gov-api-pipeline
        run: python pipeline.py --output-dir output

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bls-lns14000000
          path: gov-api-pipeline/output/
          if-no-files-found: error
          retention-days: 14
